<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grid Layout</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">

        <!-- Top Section -->
        <div class="top-section">

            <div class="box">
                <h3>Participant</h3>
                <p>1</p>
            </div>

            <div class="box">
                <h3>Participant</h3>
                <p>2</p>
            </div>

            <div class="box">
                <h3>Participant</h3>
                <p>3</p>
            </div>

            <div class="box">
                <h3>Participant</h3>
                <p>4</p>
            </div>

            <div class="box">
                <h3>Participant</h3>
                <p>5</p>
            </div>

        </div>


        <!-- Center Section -->
        <div class="meeting">
            <h2>Zoom</h2>
            <h2>Meeting</h2>
        </div>


        <!-- Bottom Section -->
        <div class="bottom-section">

            <div class="person">
                <p>audio</p>
            </div>

            <div class="person">
                <p>video</p>
            </div>

            <div class="person">
                <p>chat</p>
            </div>

            <div class="person">
                <p>meetings</p>
            </div>

        </div>

    </div>

</body>
</html>
